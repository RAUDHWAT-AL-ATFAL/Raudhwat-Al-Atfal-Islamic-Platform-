<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badilisha Password - Mfumo wa Viongozi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .card h2 { text-align: center; margin-bottom: 20px; color: #0f172a; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #475569; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #0284c7; }
        .btn-submit { width: 100%; padding: 10px; background-color: #0f766e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-submit:hover { background-color: #115e59; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Badilisha Neno la Siri</h2>
    <form id="changePasswordForm">
        <div class="form-group">
            <label>Neno la Siri la Zamani (Old Password)</label>
            <input type="password" id="oldPassword" placeholder="******" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label>Neno Jipya la Siri (New Password)</label>
            <input type="password" id="newPassword" placeholder="******" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-submit">Hifadhi Mabadiliko</button>
    </form>
</div>

<script>
    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const token = localStorage.getItem("userToken");

        if (!token) {
            alert("⛔ Huna ruhusa! Tafadhali ingia kwenye akaunti yako kwanza.");
            window.location.href = "/login.html";
            return;
        }

        try {
            const res = await fetch("http://localhost:5000/api/auth/change-password", {
                method: "PUT",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ oldPassword, newPassword })
            });

            const data = await res.json();

            if (data.success) {
                alert(data.message);
                document.getElementById("changePasswordForm").reset();
            } else {
                alert("❌ " + data.message);
            }
        } catch (err) {
            alert("❌ Imeshindwa kuunganisha na Server!");
        }
    });
</script>

</body>
</html>
